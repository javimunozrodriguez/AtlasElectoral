#panel{padding:14px 16px;overflow:auto;flex:1}h2{margin:0}h3{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}

/* --- Menú inferior independiente: Ideología · Fortaleza · Suma --- */

#toolbody{max-height:min(40vh,340px);overflow:auto;padding:6px 18px 14px;border-top:1px solid var(--line);background:var(--card)}#toolbody[hidden]{display:none}
#toolbody .tool{border:0;padding:0;margin:0}.tool-h .x{border:0;background:none;font-size:16px;cursor:pointer;color:var(--mut);margin-left:6px}

main{min-height:240px}

  html,body{height:auto}body{min-height:100vh}main{flex:none;grid-template-rows:minmax(280px,46vh) auto}#panel{max-height:55vh}

.main-nav button:hover{color:var(--ink)}

#map{position:relative;z-index:0;isolation:isolate;overflow:hidden;min-height:260px}   /* contiene los z-index de Leaflet: leyenda y atribución no pueden salirse del mapa */

.chip:hover{border-color:var(--acc)}.chip.off{opacity:.45;text-decoration:line-through}.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.cx-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}.cx-side .card{margin:0 0 14px}.cx-main .card{margin:0 0 12px}
.cx-axes{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.axis{flex:1;min-width:230px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:6px}.axis legend{font-size:11px;color:var(--mut);padding:0 4px}
.axis select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}.swap{align-self:center;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.cx-chart{position:relative;padding:10px 12px}.cx-svg{width:100%;height:auto;display:block}.cx-svg text{fill:var(--mut);font-size:12px}.cx-svg .al{fill:var(--ink);font-weight:600}.cx-svg .grid{stroke:var(--line);stroke-width:1}.cx-svg .frame{fill:none;stroke:var(--line)}
.cx-svg circle{fill-opacity:.72;stroke:#fff;stroke-width:.7;cursor:crosshair}.cx-svg circle:hover{fill-opacity:1;stroke:var(--ink);stroke-width:1.5}.cx-svg .reg{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4}

<script>
function staleShow(m){var s=document.getElementById('stale');s.hidden=false;if(m)s.insertAdjacentHTML('beforeend','<br><small>Detalle técnico: '+String(m).replace(/</g,'&lt;')+'</small>');}
window.addEventListener('error',function(e){staleShow(e.message)});window.addEventListener('unhandledrejection',function(e){staleShow(e.reason&&e.reason.message||e.reason)});
setTimeout(function(){var v=document.querySelector('.ver');if(!v||!v.textContent)staleShow();},4000);</script>
<header>
  <div class="brand">Atlas electoral <small class="ver"></small></div>
  <select id="elec" title="Elección"></select>
  <div class="search"><input id="q" type="search" placeholder="Buscar municipio…" autocomplete="off"><ul id="results" hidden></ul></div>
  <select id="mode" title="Modalidad de mapa">
    <option value="participacion">Participación</option><option value="votos">Votos de una candidatura</option>
    <option value="pct">% de voto de una candidatura</option><option value="agregado">Suma</option><option value="fortaleza">Fortaleza</option>
    <optgroup label="Ideología (los grupos los defines tú)"><option value="g:izq">Izquierdas</option><option value="g:der">Derechas</option><option value="g:na">No alineadas</option></optgroup>
  </select>

</header>

<main><div id="map"></div><aside><nav id="tabs"></nav><div id="panel"></div></aside></main>
<section id="dh" hidden></section>

<footer id="toolbar"><nav id="toolnav" aria-label="Herramientas de análisis territorial"></nav><div id="toolbody" hidden></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const NS_calc = (() => {
// Cálculos de participación, porcentajes y agregaciones. Funciones puras (sin DOM).
// Una sección/municipio se representa como s = [censo_escrutinio, blancos, nulos, votosCandidaturas, {codCandidatura: votos}]
const votesOf = (s, cods) => { let v = 0; for (const c of cods) v += s[4][c] || 0; return v; };

function totals(s) {
  const [censo, blancos, nulos, cand] = s;
  const validos = cand + blancos;          // válidos = candidaturas + blancos
  const emitidos = validos + nulos;        // emitidos = válidos + nulos
  return { censo, blancos, nulos, cand, validos, emitidos, part: censo > 0 ? emitidos / censo * 100 : null };
}
const pct = (v, validos) => (validos > 0 ? v / validos * 100 : null);

// Suma de secciones (suma votos originales, nunca porcentajes)
function sumSections(secs) {
  const t = [0, 0, 0, 0, {}];
  for (const s of Object.values(secs)) {
    for (let i = 0; i < 4; i++) t[i] += s[i];
    for (const [c, v] of Object.entries(s[4])) t[4][c] = (t[4][c] || 0) + v;
  }
  return t;
}
// Totales oficiales del municipio (ficheros 05/06) con el mismo formato
const officialAsSection = m => [m.t[0], m.t[1], m.t[2], m.t[3], Object.fromEntries(Object.entries(m.off || {}).map(([c, a]) => [c, a[0]]))];

function resultRows(m, cands) {
  const validos = m.t[3] + m.t[1];
  return Object.entries(m.off || {}).map(([cod, [votos, conc]]) => ({ cod, siglas: cands[cod] || cod, votos, pct: pct(votos, validos), conc }))
    .sort((a, b) => b.votos - a.votos || a.siglas.localeCompare(b.siglas));
}
// Comparación agregado vs resto (sobre votos válidos)
function compare(s, cods) {
  const t = totals(s), agg = votesOf(s, cods), resto = t.cand - agg;
  return { agg, resto, blancos: t.blancos, validos: t.validos, pctAgg: pct(agg, t.validos), pctResto: pct(resto, t.validos), pctBlancos: pct(t.blancos, t.validos) };
}
// Cortes de igual intervalo para escalas secuenciales
function breaks(values, n = 5) {
  const v = values.filter(x => x != null && isFinite(x)); if (!v.length) return [];
  const mn = Math.min(...v), mx = Math.max(...v); if (mn === mx) return [mn, mx];
  return Array.from({ length: n + 1 }, (_, i) => mn + (mx - mn) * i / n);
}
const classIndex = (x, br) => { if (br.length < 2) return 0; const n = br.length - 1; for (let i = 1; i < n; i++) if (x < br[i]) return i - 1; return n - 1; };

return {votesOf, totals, pct, sumSections, officialAsSection, resultRows, compare, breaks, classIndex};
})();
const NS_strength = (() => {
// Índice de fortaleza territorial = %partido en sección / %partido en municipio (misma base: votos válidos).
// Comparaciones con enteros (sin redondeos de coma flotante): índice = vs*VALID / (validosSec*V).
const CATS = { fuerte: 'Fuerte', medio: 'Medio', debil: 'Débil', sin: 'Sin clasificar', na: 'No aplicable' };
function classify(vs, validosSec, V, VALID) {
  if (V === 0) return { cat: 'na', idx: null };                      // el partido no tiene votos en el municipio
  if (validosSec <= 0) return { cat: 'sin', idx: null };             // sección sin datos válidos
  const num = vs * VALID, den = validosSec * V, idx = num / den;
  if (num * 2 > den * 3) return { cat: 'fuerte', idx };              // índice > 1,5
  if (num * 2 < den) return { cat: 'debil', idx };                   // índice < 0,5 (incluye 0 votos con media > 0)
  return { cat: 'medio', idx };                                      // 0,5 <= índice <= 1,5
}

return {CATS, classify};
})();
const NS_dhondt = (() => {
// Reparto de concejales por D'Hondt con barrera del 5 % (LOREG arts. 163.1 y 180). Funciones puras, aritmética entera.
// cands: [{cod, votos}]; validos = candidaturas + blancos (sin nulos); N = concejales a elegir.
const BARRERA = 5;
const umbralVotos = validos => Math.floor((validos * BARRERA + 99) / 100);   // ceil(5 % de válidos)
const cumple = (votos, validos) => votos > 0 && votos * 100 >= BARRERA * validos;   // "al menos el 5 %"

function distribute(cands, validos, N) {
  const eligible = [], excluded = [];
  for (const c of cands) (cumple(c.votos, validos) ? eligible : excluded).push({ ...c, pct: validos > 0 ? c.votos / validos * 100 : null });
  const q = [];
  for (const c of eligible) for (let k = 1; k <= N; k++) q.push({ cod: c.cod, k, v: c.votos });
  // mayor cociente (comparación cruzada exacta); empate de cocientes -> más votos totales (art. 163.1 d)
  q.sort((a, b) => (b.v * a.k - a.v * b.k) || (b.v - a.v));
  const win = q.slice(0, N), seats = {}; for (const c of eligible) seats[c.cod] = 0; for (const w of win) seats[w.cod]++;
  const last = win[N - 1] || null, nextLoser = q[N] || null; let tie = null;
  if (last && nextLoser && last.v * nextLoser.k === nextLoser.v * last.k) tie = { a: last, b: nextLoser, sorteo: last.v === nextLoser.v };  // sorteo = igualdad total de votos
  for (const c of eligible) c.seats = seats[c.cod];
  return { eligible, excluded, seats, win, last, nextLoser, tie, validos, N, umbral: umbralVotos(validos) };
}
const nextQuotient = (c, seats) => ({ k: seats + 1, v: c.votos, q: c.votos / (seats + 1) });

    tip.textContent = c.dataset.tip; tip.hidden = false; const r = $('#cxChart').getBoundingClientRect?.() || { left: 0, top: 0 }; tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; };
  $('#cx').onmouseout = () => { $('#cxTip').hidden = true; };
  $('#toolnav').onclick = e => { const b = e.target.closest('[data-tool]'); if (b) openTool(b.dataset.tool); };
  $('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; render(); $('#panel').scrollTop = 0; } };
  $('#panel').onclick = $('#toolbody').onclick = e => { const b = e.target.closest('[data-tm]'); if (b) { S.tabs = b.dataset.tm; render(); } if (e.target.matches('[data-clear]')) { S.sel.clear(); refresh(false); } if (e.target.closest('[data-closetool]')) { S.tool = null; render(); } const inf = e.target.closest('[data-info]'); if (inf) { S.info[inf.dataset.info] = !S.info[inf.dataset.info]; render(); } const vm = e.target.closest('[data-viewmode]'); if (vm) { S.mode = vm.dataset.viewmode; $('#mode').value = S.mode; refresh(false); } const g = e.target.closest('[data-viewg]'); if (g) { S.mode = 'g:' + g.dataset.viewg; $('#mode').value = S.mode; refresh(false); } };
  $('#panel').onchange = $('#toolbody').onchange = e => {
    if (e.target.dataset.cod) { e.target.checked ? S.sel.add(e.target.dataset.cod) : S.sel.delete(e.target.dataset.cod); S.mode = 'agregado'; $('#mode').value = 'agregado'; refresh(false); }
    if (e.target.dataset.sig) { S.store.set(e.target.dataset.sig, e.target.checked ? e.target.dataset.g : null); isG(S.mode) ? refresh(false) : render(); }
    if (e.target.id === 'useAgg') { S.useAgg = e.target.checked; refresh(false); }
  };
  document.querySelector('.main-nav').onclick = e => { const b = e.target.closest('[data-view]'); if (b) setPage(b.dataset.view); };
  $('#dh').onchange = e => { if (e.target.id === 'dhCand') { S.dh.cod = e.target.value; S.dh.extra = 0; } if (e.target.id === 'dhExtra') S.dh.extra = Math.max(0, Math.floor(+e.target.value || 0)); renderDh(); };
  $('#dh').onclick = e => { const b = e.target.closest('[data-act]'); if (!b) return; S.dh.extra = b.dataset.act === 'need' ? H.needed(S) : 0; renderDh(); };
  window.addEventListener('resize', M.resize);
}
init().catch(err => { $('#panel').innerHTML = `<p class="warn">No se pudieron cargar los datos: ${U.esc(err.message)}. Ejecuta pipeline/build_data.py y sirve la carpeta con un servidor local.</p>`; });

return {};
})();
</script>
